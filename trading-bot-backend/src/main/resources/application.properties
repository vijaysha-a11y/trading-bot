spring.application.name=trading-bot-backend

# --- MySQL ---
spring.datasource.url=jdbc:mysql://localhost:3306/rgv_db
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Server ---
server.port=8080
trading.frontend.allowed-origins=${TRADING_FRONTEND_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173}

# --- Trading config ---
trading.symbol=BTCUSDT
trading.scheduler.interval=60000
trading.market-data.base-url=https://data-api.binance.vision